name: Linux tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # reviewed Node24 commit
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssl curl python3
      - name: Bash syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR install.sh relay.sh lib/*.sh tests/*.sh
      - name: Verify bootstrap payload pins
        run: python3 tools/update-bootstrap-pins.py --check
      - name: Unit, lifecycle and real TLS forwarding tests
        run: bash tests/run.sh
      - name: Real production-path systemd install and uninstall
        if: matrix.os == 'ubuntu-24.04'
        run: bash tests/systemd-smoke.sh
  debian:
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 15
    steps:
      - name: Install test tools
        run: apt-get update && apt-get install -y ca-certificates git bash shellcheck openssl curl python3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # reviewed Node24 commit
        with:
          persist-credentials: false
      - name: Bash syntax and ShellCheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          shellcheck -x -P SCRIPTDIR install.sh relay.sh lib/*.sh tests/*.sh
      - name: Verify bootstrap payload pins
        run: python3 tools/update-bootstrap-pins.py --check
      - name: Unit, lifecycle and real TLS forwarding tests
        run: bash tests/run.sh
